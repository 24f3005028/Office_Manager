[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "office-hub"
version = "0.1.0"
description = "A local Windows dashboard for safe, durable office automation jobs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Office Hub" }]
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "types-openpyxl>=3.1,<4",
]
integrations = [
    "gspread>=6,<7",
    "google-auth>=2.29,<3",
    "pyautogui>=0.9.54,<1",
    "pywinauto>=0.6.8,<1; sys_platform == 'win32'",
]

[project.scripts]
office-hub = "office_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
office_hub = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^migrations/"]
