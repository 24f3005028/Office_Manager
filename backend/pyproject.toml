[project]
name = "office-document-dashboard-backend"
version = "1.0.0"
description = "Local Office document dashboard API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "google-auth>=2.28,<3",
    "requests>=2.32,<3",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<3",
    "reportlab>=4,<5",
    "python-multipart>=0.0.9,<1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
    "xlrd>=2.0,<3",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["tests/"]
