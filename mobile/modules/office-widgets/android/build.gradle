plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hstraders.widgets'
version = '1.0.0'

android {
  namespace 'com.hstraders.widgets'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
      systemProperty 'office.widget.previewDir', rootProject.file('../../output/mobile-ui').absolutePath
    }
  }
}

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
  // Expo 58 autolinks Notifications as a prebuilt local Maven artifact.
  def notificationsVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../node_modules/expo-notifications/package.json')).version
  implementation "host.exp.exponent:expo.modules.notifications:${notificationsVersion}"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.17'
}
